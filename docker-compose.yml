version: "3.9"

# ============================================================
# MedComplyAI - Full Stack Docker Compose
#
# Services:
#   - backend   : FastAPI (port 8000)
#   - frontend  : Next.js  (port 3000)
#   - qdrant    : Vector DB (port 6333)
#   - ollama    : Local LLM inference (port 11434)
#   - langfuse  : LLM Observability (port 3030)  [optional]
#
# Quick start:
#   docker compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # Qdrant - Vector Database
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: medcomplyai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Ollama - Local LLM Inference
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: medcomplyai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support — comment out if no GPU available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Backend - FastAPI
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medcomplyai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/meta/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Frontend - Next.js
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: medcomplyai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------
  # Langfuse - LLM Observability (optional, profile: observability)
  # ----------------------------------------------------------
  langfuse-server:
    image: langfuse/langfuse:latest
    container_name: medcomplyai-langfuse
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3030:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-in-production}
      SALT: ${LANGFUSE_SALT:-changeme-in-production}
    depends_on:
      - langfuse-db

  langfuse-db:
    image: postgres:15-alpine
    container_name: medcomplyai-langfuse-db
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  backend_storage:
    driver: local
  langfuse_db_data:
    driver: local
