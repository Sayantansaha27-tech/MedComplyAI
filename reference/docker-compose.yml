# ============================================================
# MedComplyAI - Full Stack Docker Compose
#
# Services:
#   - qdrant    : Vector DB (port 6333)          public image
#   - ollama    : Local LLM inference (11434)    public image
#   - backend   : FastAPI (port 8000)            private image, auth required
#   - frontend  : Next.js  (port 3000)           private image, auth required
#
# Observability (Langfuse) is a separate overlay file, see
# docker-compose.observability.yml.
#
# MedComplyAI is closed source. The backend and frontend images are
# published privately, so qdrant and ollama start for anyone while
# backend and frontend need registry access:
#
#   gh auth token | docker login ghcr.io -u <your-github-user> --password-stdin
#   cp .env.example .env
#   docker compose up -d
#
# Without that login, `docker compose up -d` starts qdrant and ollama
# and fails to pull backend and frontend. That is expected.
# ============================================================

services:

  # ----------------------------------------------------------
  # Qdrant - Vector Database
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: medcomplyai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      # The qdrant image ships no curl or wget. It does ship bash, so probe
      # over /dev/tcp instead of assuming an HTTP client exists.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Ollama - Local LLM Inference
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: medcomplyai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU is opt-in via docker-compose.gpu.yml. Declaring an nvidia
    # reservation here makes `docker compose up` fail outright on every
    # host without the NVIDIA container toolkit, rather than degrading
    # to CPU inference.
    healthcheck:
      # No curl in the ollama image either. bash is present.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11434"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Backend - FastAPI
  # ----------------------------------------------------------
  backend:
    # Published image, not built from source. Requires authentication:
    #   gh auth token | docker login ghcr.io -u <your-github-user> --password-stdin
    image: ghcr.io/sayantansaha27-tech/medcomplyai-backend:0.1.0
    container_name: medcomplyai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # python:3.10-slim ships no curl. Use the interpreter that is
      # guaranteed to be there rather than adding a package for one probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/meta/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Frontend - Next.js
  # ----------------------------------------------------------
  frontend:
    # Published image, not built from source. Requires authentication.
    image: ghcr.io/sayantansaha27-tech/medcomplyai-frontend:0.1.0
    container_name: medcomplyai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  backend_storage:
    driver: local
